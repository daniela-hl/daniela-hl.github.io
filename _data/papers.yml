- id: markov_jsq
  title: "Markov Modulated JSQ in Heavy Traffic via the Poisson Equation"
  coauthors:
    - name: "Izzy Grosof"
      url: "https://isaacg1.github.io/"
  url: "https://arxiv.org/abs/2603.00387"
  date: "2025-12-01"
  section: under_review
  abstract:
    - >-
      In parallel-server systems with a single stream of arrivals,
      Join-the-Shortest-Queue (JSQ) is one of the most popular routing algorithms
      due to its simplicity and strong performance properties: it is well known
      that routing with JSQ is throughput and heavy-traffic optimal, regardless
      of whether the servers are homogeneous or not. Further, JSQ is optimal and
      does not need any information about the servers' rates. In this work, we
      study a JSQ system with Markov-modulated arrival and service rates.
      Specifically, we provide sufficient conditions on the Markov-modulated
      arrival and service rates to ensure state space collapse, and compute the
      heavy-traffic distribution of queue lengths. We establish the distribution
      of queue lengths using a novel hybrid methodology that combines the
      Transform Method for queue-lengths analysis, and Poisson Equation of the
      Markov-modulating chain.
  status_text: "Under review."

- id: sek_smod
  title: "Outperforming Multiserver SRPT at All Loads"
  coauthors:
    - name: "Izzy Grosof"
      url: "https://isaacg1.github.io/"
  url: "/files/sek-improves.pdf"
  date: "2025-11-01"
  section: under_review
  abstract:
    - >-
      A well-designed scheduling policy can unlock significant performance
      improvements with no additional resources. Multiserver SRPT (SRPT-k) is
      known to achieve asymptotically optimal mean response time in the heavy
      traffic limit, as load approaches capacity. No better policy is known for
      the M/G/$k$ queue in any regime. We introduce a new policy,
      SRPT-Except-k+1 & Modified SRPT (SEK-SMOD), which is the first policy to
      provably achieve lower mean response time than SRPT-k. SEK-SMOD outperforms
      SRPT-k across all loads and all job size distributions. The key idea behind
      SEK-SMOD is to prioritize large jobs over small jobs in specific scenarios
      to improve server utilization, and thereby improve the response time of
      subsequent jobs in expectation. Our proof is a novel application of hybrid
      worst-case and stochastic techniques to relative analysis, where we
      analyze the deviations of our proposed SEK-SMOD policy away from the
      SRPT-k baseline policy. Furthermore, we design Practical-SEK (a simplified
      variant of SEK-SMOD) and empirically verify the improvement over SRPT-k
      via simulation.
  status_text: "Accepted for ACM Sigmetrics 2026; Journal version under review."

- id: expo_tail_bounds
  title: "Exponential Tail Bounds on Queues: A Confluence of Non-Asymptotic Heavy-Traffic and Large Deviations"
  coauthors:
    - name: "Prakirt Jhunjhunwala"
      url: "https://sites.google.com/view/prakirtjhunjhunwala"
    - name: "Siva Theja Maguluri"
      url: "https://sites.google.com/site/sivatheja/"
  url: "https://arxiv.org/pdf/2306.10187"
  date: "2023-06-15"
  section: under_review
  abstract:
    - >-
      In general, obtaining the exact steady-state distribution of queue lengths
      is not feasible. Therefore, our focus is on establish bounds for the tail
      probabilities of queue lengths. Specifically, we examine queueing systems
      under Heavy-Traffic (HT) conditions and provide exponentially decaying
      bounds for the probability $P(\epsilon q>x)$, where $\epsilon$ is the HT
      parameter denoting how far the load is from the maximum allowed load. Our
      bounds are not limited to asymptotic cases and are applicable even for
      finite values of $\epsilon$, and they get sharper as $\epsilon\to 0$.
      Consequently, we derive non-asymptotic convergence rates for the tail
      probabilities. Unlike other approaches such as moment bounds based on
      drift arguments and bounds on Wasserstein distance using Stein's method,
      our method yields sharper tail bounds. Furthermore, our results offer
      bounds on the exponential rate of decay of the tail, given by
      $-\frac{1}{x} \log P(\epsilon q > x)$ for any finite value of $x$. These
      can be interpreted as non-asymptotic versions of Large Deviation (LD)
      results. To obtain our results, we use an exponential Lyapunov function
      to bound the moment generating function of queue lengths and apply
      Markov's inequality.
    - >-
      We demonstrate our approach by presenting tail bounds for: (i) a
      continuous time Join-the-shortest queue (JSQ) load balancing system,
      (ii) a discrete time single-server queue and (iii) an $M/M/n$ queue. We
      not only bridge the gap between classical-HT and LD regimes but also
      explore the large system HT regimes for JSQ and $M/M/n$ systems. In
      these regimes, both the system size and the system load increase
      simultaneously. Our results also close a gap in the existing literature
      on the limiting distribution of JSQ in the super-NDS (a.k.a. super
      slowdown) regime. This contribution is of an independent interest.
      Here, a key ingredient is a more refined characterization of state space
      collapse for JSQ system, achieved by using an exponential Lyapunov
      function designed to approximate the $\ell_\infty$ norm.
  versions:
    - status: "Accepted for IFIP Performance 2023. This version is available"
      url: "https://dl.acm.org/doi/abs/10.1145/3649477.3649488"
    - status: "Journal version under review. The latest journal version is available"
      url: "https://arxiv.org/pdf/2306.10187"

- id: transform_tutorial
  title: "Transform Method for Stochastic Processing and Matching Networks"
  coauthors:
    - name: "Sushil Mahavir Varma"
      url: "https://sites.google.com/view/sushil-varma/home"
    - name: "Prakirt Jhunjhunwala"
      url: "https://sites.google.com/view/prakirtjhunjhunwala"
    - name: "Siva Theja Maguluri"
      url: "https://sites.google.com/site/sivatheja/"
  venue: "Tutorials in Operations Research (2026 INFORMS TutORials)"
  year: 2026
  date: "2026-11-01"
  section: published
  note: "upcoming"
  abstract:
    - >-
      Modern service systems—ranging from cloud data centers and ride-hailing
      platforms to healthcare facilities—operate at massive scales where
      congestion is a critical challenge. Utilizing an operations research
      approach, these systems are analyzed by modeling them as complex
      stochastic processes, which are typically understood through
      process-level convergence to fluid and diffusion limits. However, these
      methods often prove technically dense and provide limited guidance for
      finite, practical system scales. The transform method, presented in this
      tutorial, was recently developed as a unified and tractable framework for
      the steady-state analysis of Stochastic Processing and Matching Networks
      (SPNs/SMNs). The transform method overcomes the technical hurdles of
      process-level convergence by working directly with the pre-limit system.
      By exploiting the zero-drift property of exponential test functions, the
      method derives explicit functional equations (acting as a proxy for
      global balance equations) for the transforms (such as moment-generating
      functions) of queue-length distributions. This approach provides sharp,
      non-asymptotic performance guarantees, bridging the gap between
      theoretical asymptotics and real-world system behavior.
    - >-
      Since its introduction in 2020 for load-balancing in data center
      networks, the transform method has been extended to handle realistic
      complexities, including customer abandonment, state-dependent arrivals,
      Markov-modulated arrivals, large-system scale, and multi-dimensional
      networks with multiple bottlenecks. We survey these theoretical advances
      and demonstrate their practical relevance across diverse domains, such as
      matching markets and networked service systems. The transform method
      provides interpretable bounds tied directly to system parameters,
      offering a powerful analytical alternative to simulation-heavy or purely
      asymptotic approaches for system design and control.

